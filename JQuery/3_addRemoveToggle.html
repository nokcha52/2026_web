<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JQuery - tab 과 customInput으로 알아보는 add,remove,toggle</title>
    <script src="https://code.jquery.com/jquery-latest.min.js"></script>
    <script src="js/3_addRemoveToggle.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Material+Icons');
        .cp{
            margin-bottom: 50px;
        }
        .cp span{
            display: inline-block;
            vertical-align: middle;
            line-height:15px;
            cursor: default;
        }
    </style>
</head>
<body>
    <!-- case 1. checkbox 만들어보기 -->
     <!-- 웹표준은 박살나지만 이렇게 만들기도 함 -->
    <!-- cp : component -->
    <div class="cp checkBox"> 
        <span class="material-icons checkIco">check_box_outline_blank</span>
        <!-- googlefont에서 icon에서 span에 안에 해당 아이콘 이름을 적으면 연동되어서 아이콘으로 변경된다. -->
        <span class="label checkLabel">checkBox Label</span>
    </div>
</body>
</html>
